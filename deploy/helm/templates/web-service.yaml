apiVersion: v1
kind: Service
metadata:
  name: {{ include "compliance.fullname" . }}-web
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "compliance.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
