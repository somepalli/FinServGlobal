{{- if .Values.vllm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "compliance.fullname" . }}-vllm
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  type: ClusterIP
  selector:
    {{- include "compliance.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
