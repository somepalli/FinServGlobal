apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "compliance.fullname" . }}-qdrant
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "compliance.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "compliance.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "compliance.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: qdrant
          image: {{ include "compliance.image" .Values.qdrant.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.qdrant.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
