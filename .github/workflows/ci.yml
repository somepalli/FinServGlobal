name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.5.11"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy apps/api/src
      - run: uv run pytest

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --dev
      - name: lockfile is in sync
        run: uv lock --check
      - run: uv run bandit -q -r apps/api/src
      - name: dependency audit
        run: |
          uv export --format requirements-txt --no-hashes -o /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm audit --audit-level=high
      - run: pnpm build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            -r
            ./
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [python, python-security, web, supply-chain]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: build and push api
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/compliance-api:${{ github.sha }}
      - name: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ecr.outputs.registry }}/compliance-api:${{ github.sha }}
          format: cyclonedx-json
      - name: vulnerability gate
        uses: anchore/scan-action@v5
        with:
          image: ${{ steps.ecr.outputs.registry }}/compliance-api:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - uses: sigstore/cosign-installer@v3
      - name: sign image
        run: cosign sign --yes ${{ steps.ecr.outputs.registry }}/compliance-api@${{ steps.build.outputs.digest }}

  eval-gate:
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --dev
      - name: retrieval quality gate
        run: uv run python -m compliance.eval.run --suite ci --min-faithfulness 0.80

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked --dev
      - name: python licence inventory
        run: |
          uvx pip-licenses --format=markdown --with-urls \
            --fail-on="BUSL-1.1;SSPL-1.0;Elastic-2.0;Commons-Clause;PolyForm-Noncommercial-1.0.0" \
            > /tmp/py-licences.md
      - name: node licence inventory
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm licenses list --json > /tmp/node-licences.json
      - name: fail on non-open-source node packages
        run: |
          uvx --from license-expression python - <<'PY'
          import json, sys
          DENY = {"BUSL-1.1", "SSPL-1.0", "Elastic-2.0", "LicenseRef-scancode-commons-clause"}
          data = json.load(open("/tmp/node-licences.json"))
          bad = [lic for lic in data if lic in DENY]
          if bad:
              print("denied licences found:", bad, file=sys.stderr)
              sys.exit(1)
          print(f"{len(data)} distinct licences, none denied")
          PY
