[project]
name = "compliance"
version = "0.1.0"
authors = [{ name = "somepalli", email = "105231+somepalli@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "qdrant-client>=1.12",
    "docling>=2.0",
    "FlagEmbedding>=1.3",
    "transformers>=5.5,<6",
    "httpx>=0.27",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "PyYAML>=6.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "ragas>=0.4,<0.5",
    "openai>=1.109,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance"]
